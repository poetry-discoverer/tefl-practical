<script>window.LESSON_ID="tefl2-08";window.STEPS=[{"t": "section", "h": "Present perfect | المضارع التام", "n": 8, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Experience: I have travelled all over the world.</div><div class=\"u\">الخبرة: I have travelled all over the world.</div>", "n": 8, "i": 1, "a": "tefl2-08-001", "x": "fe191deb"}, {"t": "learn", "h": "<div class=\"u\">A link from the past to the present: I have worked here for three years.</div><div class=\"u\">ربط من الماضي للحاضر: I have worked here for three years.</div>", "n": 8, "i": 2, "a": "tefl2-08-002", "x": "5810e402"}, {"t": "learn", "h": "<div class=\"u\">A present result of a past action: He has painted the kitchen.</div><div class=\"u\">نتيجة حالية لحدث ماضي: He has painted the kitchen.</div>", "n": 8, "i": 3, "a": "tefl2-08-003", "x": "6fbc48fe"}, {"t": "learn", "h": "<div class=\"u\">Why do we say I have worked and he has painted? We use have or has with the past participle. Has goes with he, she and it.</div><div class=\"u\">ليه بنقول I have worked وhe has painted؟ بنستخدم have أو has مع التصريف التالت. وhas مع he وshe وit.</div>", "n": 8, "i": 4, "a": "tefl2-08-004", "x": "95a74e62"}, {"t": "learn", "h": "<div class=\"u\">Present perfect continuous shows duration: I have been working here for several years.</div><div class=\"u\">المضارع التام المستمر بيوضّح المدة: I have been working here for several years.</div>", "n": 8, "i": 5, "a": "tefl2-08-005", "x": "fb1a2a85"}, {"t": "section", "h": "Past simple and past continuous | الماضي البسيط والمستمر", "n": 8, "i": 6}, {"t": "learn", "h": "<div class=\"u\">Past simple: finished actions. It rained all day yesterday.</div><div class=\"u\">الماضي البسيط: أحداث منتهية. It rained all day yesterday.</div>", "n": 8, "i": 7, "a": "tefl2-08-006", "x": "9e1122ca"}, {"t": "learn", "h": "<div class=\"u\">Repeated actions: She went to work by bicycle every day last week. Actions one after another: When he turned the tap on, he burnt himself.</div><div class=\"u\">أحداث متكررة: She went to work by bicycle every day last week. أحداث ورا بعض: When he turned the tap on, he burnt himself.</div>", "n": 8, "i": 8, "a": "tefl2-08-007", "x": "fbf56be1"}, {"t": "learn", "h": "<div class=\"u\">Past continuous: an action in progress in the past. I was getting more and more angry.</div><div class=\"u\">الماضي المستمر: حدث جاري في الماضي. I was getting more and more angry.</div>", "n": 8, "i": 9, "a": "tefl2-08-008", "x": "9cc07c6c"}, {"t": "learn", "h": "<div class=\"u\">It also sets the scene in stories: The sun was shining and the birds were singing.</div><div class=\"u\">وبيحدد المشهد في الحواديت: The sun was shining and the birds were singing.</div>", "n": 8, "i": 10, "a": "tefl2-08-009", "x": "3f8bb4ca"}, {"t": "learn", "h": "<div class=\"u\">Interrupted action: He was having a shower when the phone rang. Two actions at the same time: While George was watching television, Maggie was knitting.</div><div class=\"u\">حدث اتقاطع: He was having a shower when the phone rang. حدثين في نفس الوقت: While George was watching television, Maggie was knitting.</div>", "n": 8, "i": 11, "a": "tefl2-08-010", "x": "61729777"}, {"t": "section", "h": "Past perfect | الماضي التام", "n": 8, "i": 12}, {"t": "learn", "h": "<div class=\"u\">Past perfect: a past action that happened before another past action. He had studied very hard before he took the exam.</div><div class=\"u\">الماضي التام: حدث ماضي حصل قبل حدث ماضي تاني. He had studied very hard before he took the exam.</div>", "n": 8, "i": 13, "a": "tefl2-08-011", "x": "3957c9cc"}, {"t": "learn", "h": "<div class=\"u\">Past perfect continuous: duration before a past moment. She had been looking for her contact lenses for ages before they turned up.</div><div class=\"u\">الماضي التام المستمر: مدة قبل لحظة في الماضي. She had been looking for her contact lenses for ages before they turned up.</div>", "n": 8, "i": 14, "a": "tefl2-08-012", "x": "69976aef"}, {"t": "learn", "h": "<div class=\"u\">Tip for teaching: draw a timeline. Mark the earlier event, the later event and now, so the order is clear.</div><div class=\"u\">نصيحة للتدريس: ارسم خط زمني. علّم الحدث الأسبق والحدث الأحدث والدلوقتي، عشان الترتيب يبقى واضح.</div>", "n": 8, "i": 15, "a": "tefl2-08-013", "x": "b19dd41c"}, {"t": "section", "h": "Future simple | المستقبل البسيط", "n": 8, "i": 16}, {"t": "learn", "h": "<div class=\"u\">English has no future tense as such. It uses many forms. One is will + verb.</div><div class=\"u\">الإنجليزي مفيهوش زمن مستقبل بمعنى الكلمة. بيستخدم أشكال كتير. واحد منهم will + فعل.</div>", "n": 8, "i": 17, "a": "tefl2-08-014", "x": "52b9b46f"}, {"t": "learn", "h": "<div class=\"u\">Will can show intention: I will go to school tomorrow. Prediction: He will have an accident if he drives like that. A sudden decision: I know, I will get a takeaway.</div><div class=\"u\">will ممكن تعبّر عن نية: I will go to school tomorrow. توقع: He will have an accident if he drives like that. قرار مفاجئ: I know, I will get a takeaway.</div>", "n": 8, "i": 18, "a": "tefl2-08-015", "x": "323da8b0"}, {"t": "learn", "h": "<div class=\"u\">Other modals also work: I shall get a takeaway. I could get a takeaway. I might get a takeaway.</div><div class=\"u\">أفعال ناقصة تانية كمان بتنفع: I shall get a takeaway. I could get a takeaway. I might get a takeaway.</div>", "n": 8, "i": 19, "a": "tefl2-08-016", "x": "a7685984"}, {"t": "section", "h": "Summary | الخلاصة", "n": 8, "i": 20}, {"t": "learn", "h": "<div class=\"u\">Present perfect links past and now. Past simple is finished. Past continuous is in progress. Past perfect is earlier than another past event. Will has three main uses.</div><div class=\"u\">المضارع التام بيربط الماضي بدلوقتي. الماضي البسيط منتهي. الماضي المستمر جاري. الماضي التام أسبق من حدث ماضي تاني. وwill ليها ٣ استخدامات أساسية.</div>", "n": 8, "i": 21, "a": "tefl2-08-017", "x": "c9999238"}, {"t": "mc", "q": "I have travelled all over the world shows:<br>I have travelled all over the world بتوضّح:", "opts": ["experience | خبرة", "a habit in the past | عادة في الماضي", "a sudden decision | قرار مفاجئ"], "ans": 0, "why": "The present perfect can express experience. | المضارع التام بيعبّر عن خبرة.", "ex": ["Correct. | صح.", "No. It has no specific past time. | غلط: مفيش وقت ماضي محدد.", "No. Sudden decisions use will. | غلط: القرارات المفاجئة بتستخدم will."], "n": 8, "i": 22, "h": ""}, {"t": "mc", "q": "Which sentence uses the past continuous for an interrupted action?<br>أنهي جملة بتستخدم الماضي المستمر لحدث اتقاطع؟", "opts": ["He was having a shower when the phone rang. | He was having a shower when the phone rang.", "He had a shower. | He had a shower.", "He has had a shower. | He has had a shower."], "ans": 0, "why": "The shower was in progress when the phone rang. | الدش كان جاري لما التليفون رن.", "ex": ["Correct. | صح.", "No. That is a simple finished action. | غلط: ده حدث بسيط منتهي.", "No. That is present perfect. | غلط: ده مضارع تام."], "n": 8, "i": 23, "h": ""}, {"t": "mc", "q": "He had studied hard before he took the exam. Which action came first?<br>He had studied hard before he took the exam. أنهي حدث حصل الأول؟", "opts": ["studying | المذاكرة", "taking the exam | دخول الامتحان", "Both together | الاتنين مع بعض"], "ans": 0, "why": "The past perfect shows the earlier action. | الماضي التام بيوضّح الحدث الأسبق.", "ex": ["Correct. | صح.", "No. That came later. | غلط: ده جه بعدين.", "No. They happened in order. | غلط: حصلوا بالترتيب."], "n": 8, "i": 24, "h": ""}, {"t": "mc", "q": "I have been working here for several years is:<br>I have been working here for several years هي:", "opts": ["present perfect continuous | مضارع تام مستمر", "past perfect | ماضي تام", "future simple | مستقبل بسيط"], "ans": 0, "why": "Have been + ing shows duration. | have been + ing بتوضّح المدة.", "ex": ["Correct. | صح.", "No. Past perfect uses had. | غلط: الماضي التام بيستخدم had.", "No. It is not about the future. | غلط: مش عن المستقبل."], "n": 8, "i": 25, "h": ""}, {"t": "mc", "q": "Which sentence is a sudden decision with will?<br>أنهي جملة بتعبّر عن قرار مفاجئ بـ will؟", "opts": ["I know, I will get a takeaway. | I know, I will get a takeaway.", "I will have driven 200 km. | I will have driven 200 km.", "I was getting angry. | I was getting angry."], "ans": 0, "why": "I know, I will... shows a decision made at the moment of speaking. | I know, I will... بتوضّح قرار اتاخد لحظة الكلام.", "ex": ["Correct. | صح.", "No. That is future perfect. | غلط: ده مستقبل تام.", "No. That is past continuous. | غلط: ده ماضي مستمر."], "n": 8, "i": 26, "h": ""}, {"t": "mc", "q": "The sun was shining and the birds were singing sets the scene. Which tense?<br>The sun was shining and the birds were singing بتحدد المشهد. أنهي زمن؟", "opts": ["past continuous | ماضي مستمر", "past simple | ماضي بسيط", "present perfect | مضارع تام"], "ans": 0, "why": "Past continuous often describes the background in a story. | الماضي المستمر غالبًا بيوصف خلفية الحدوتة.", "ex": ["Correct. | صح.", "No. Past simple moves the story on. | غلط: الماضي البسيط بيحرّك الحدوتة.", "No. It is a past scene. | غلط: ده مشهد ماضي."], "n": 8, "i": 27, "h": ""}, {"t": "tf", "q": "The past simple is used for finished actions.<br>الماضي البسيط بيتستخدم للأحداث المنتهية.", "ans": true, "why": "True. It rained all day yesterday. | صح. It rained all day yesterday.", "ex": ["Correct. | صح.", "Wrong. Finished actions are the main use. | غلط: الأحداث المنتهية هي الاستخدام الأساسي."], "n": 8, "i": 28, "h": ""}, {"t": "tf", "q": "English has one single future tense.<br>الإنجليزي فيه زمن مستقبل واحد.", "ans": false, "why": "False. It uses many forms. | غلط. بيستخدم أشكال كتير.", "ex": ["Wrong. Many forms. | غلط: أشكال كتير.", "Correct. | صح."], "n": 8, "i": 29, "h": ""}, {"t": "tf", "q": "The present perfect can link the past to the present.<br>المضارع التام ممكن يربط الماضي بالحاضر.", "ans": true, "why": "True. I have worked here for three years. | صح. I have worked here for three years.", "ex": ["Correct. | صح.", "Wrong. That is a main use. | غلط: ده استخدام أساسي."], "n": 8, "i": 30, "h": ""}, {"t": "tf", "q": "Past perfect continuous means a short single past action.<br>الماضي التام المستمر معناه حدث ماضي قصير واحد.", "ans": false, "why": "False. It shows duration before another past moment. | غلط. بيوضّح مدة قبل لحظة ماضية تانية.", "ex": ["Wrong. It shows duration. | غلط: بيوضّح المدة.", "Correct. | صح."], "n": 8, "i": 31, "h": ""}, {"t": "tf", "q": "He has painted the kitchen shows a present result of a past action.<br>He has painted the kitchen بتوضّح نتيجة حالية لحدث ماضي.", "ans": true, "why": "True. The kitchen is painted now. | صح. المطبخ مدهون دلوقتي.", "ex": ["Correct. | صح.", "Wrong. It focuses on the result now. | غلط: بتركّز على النتيجة دلوقتي."], "n": 8, "i": 32, "h": ""}, {"t": "recall", "q": "Give three uses of the present perfect.<br>اذكر ٣ استخدامات للمضارع التام.", "a": "Experience, linking the past to the present, and a present result of a past action.<br>الخبرة، ربط الماضي بالحاضر، ونتيجة حالية لحدث ماضي.", "n": 8, "i": 33, "h": ""}, {"t": "recall", "q": "Give four uses of the past continuous.<br>اذكر ٤ استخدامات للماضي المستمر.", "a": "Actions in progress in the past, scene-setting in stories, interrupted actions, and two actions at the same time.<br>أحداث جارية في الماضي، تحديد المشهد في الحواديت، أحداث اتقاطعت، وحدثين في نفس الوقت.", "n": 8, "i": 34, "h": ""}, {"t": "recall", "q": "Give three uses of will for the future.<br>اذكر ٣ استخدامات لـ will في المستقبل.", "a": "Intention, prediction, and a sudden decision.<br>نية، توقع، وقرار مفاجئ.", "n": 8, "i": 35, "h": ""}, {"t": "write", "q": "Explain how past perfect differs from present perfect (3-4 sentences).<br>اشرح الفرق بين الماضي التام والمضارع التام (٣-٤ جمل).", "key": "tefl2-08:1", "a": "The present perfect links the past to now: I have worked here for three years. The past perfect looks at the time before another time in the past: he had studied before he took the exam. One connects to the present, the other connects to a past moment. A timeline helps learners see the difference.<br>المضارع التام بيربط الماضي بدلوقتي: I have worked here for three years. الماضي التام بيبص للوقت قبل وقت تاني في الماضي: he had studied before he took the exam. واحد بيتصل بالحاضر والتاني بلحظة في الماضي. والخط الزمني بيساعد المتعلمين يشوفوا الفرق.", "n": 8, "i": 36, "h": ""}, {"t": "write", "q": "Write four sentences using different past tenses (3-4 sentences).<br>اكتب ٤ جمل بأزمنة ماضي مختلفة (٣-٤ جمل).", "key": "tefl2-08:2", "a": "For example: I walked home. I was walking when it rained. I had finished my work before dinner. I have lived here for ten years.<br>مثلًا: I walked home. I was walking when it rained. I had finished my work before dinner. I have lived here for ten years.", "n": 8, "i": 37, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Unit 3 begins: how to present a new grammar structure in class.</div><div class=\"u\">الدرس الجاي: بداية الوحدة ٣: إزاي نقدّم تركيب نحوي جديد في الفصل.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 38}];</script>
