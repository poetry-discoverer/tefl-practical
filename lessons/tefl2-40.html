<h1>كورس TEFL العملي ٤٠: تخطيط كورس كامل</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: متوسط</span><span class="tag">درس ٤٠</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl2-40";window.STEPS=[{"t": "section", "h": "Give learners a real course | اديّ المتعلمين كورس حقيقي", "n": 40, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Learners need an integrated language course, not a random mix of activities.</div><div class=\"u\">المتعلمين محتاجين كورس لغة متكامل، مش خليط عشوائي من الأنشطة.</div>", "n": 40, "i": 1, "a": "tefl2-40-001", "x": "29e93864"}, {"t": "section", "h": "Step 1: find out what they need | الخطوة ١: اعرف محتاجين إيه", "n": 40, "i": 2}, {"t": "learn", "h": "<div class=\"u\">You can use questionnaires, discussions and written homework. Ask why they learn English and what they want to do with it.</div><div class=\"u\">تقدر تستخدم استبيانات ونقاشات وواجب كتابي. اسألهم ليه بيتعلموا إنجليزي وعايزين يعملوا بيه إيه.</div>", "n": 40, "i": 3, "a": "tefl2-40-002", "x": "a2ed9f80"}, {"t": "learn", "h": "<div class=\"u\">Ask what matters more: accuracy or fluency. Which skills come first: listening, speaking, reading or writing?</div><div class=\"u\">اسأل إيه الأهم: الدقة أو الطلاقة. أنهي مهارات الأول: استماع أو كلام أو قراءة أو كتابة؟</div>", "n": 40, "i": 4, "a": "tefl2-40-003", "x": "2ade51c6"}, {"t": "learn", "h": "<div class=\"u\">Do they need special skills, like using the telephone, taking messages or writing business letters? Are they studying for an exam, school or external?</div><div class=\"u\">هل محتاجين مهارات خاصة، زي التليفون وأخذ الرسائل وكتابة خطابات الأعمال؟ وهل بيذاكروا لامتحان، مدرسي أو خارجي؟</div>", "n": 40, "i": 5, "a": "tefl2-40-004", "x": "6f9d3f54"}, {"t": "section", "h": "Step 2: find out what they can do | الخطوة ٢: اعرف يقدروا يعملوا إيه", "n": 40, "i": 6}, {"t": "learn", "h": "<div class=\"u\">Give fluency tasks and watch how well they do. Give written homework to test writing. Offer lots of listening and reading to see strengths and weaknesses.</div><div class=\"u\">اديّ مهام طلاقة وشوف بيعملوها كويس قد إيه. اديّ واجب كتابي لاختبار الكتابة. وفّر استماع وقراءة كتير عشان تشوف نقاط القوة والضعف.</div>", "n": 40, "i": 7, "a": "tefl2-40-005", "x": "04ab85a4"}, {"t": "learn", "h": "<div class=\"u\">Test grammar. You may be surprised how much they know, or do not know. Most students are happy to do standard exercises to check themselves.</div><div class=\"u\">اختبر القواعد. ممكن تتفاجئ بقد إيه عارفين أو مش عارفين. معظم الطلاب مبسوطين يعملوا تمارين عادية يتأكدوا بيها.</div>", "n": 40, "i": 8, "a": "tefl2-40-006", "x": "b85bc1de"}, {"t": "section", "h": "Step 3: judge the course book | الخطوة ٣: احكم على الكتاب", "n": 40, "i": 9}, {"t": "learn", "h": "<div class=\"u\">You may not choose the book, so look at it closely. Add your own ideas or other sources for gaps.</div><div class=\"u\">ممكن ماتختارش الكتاب، فبص عليه كويس. ضيف أفكارك أو مصادر تانية للفجوات.</div>", "n": 40, "i": 10, "a": "tefl2-40-007", "x": "072dd7b0"}, {"t": "learn", "h": "<div class=\"u\">Ask: is there a good balance of skills? Is there new language and recycling? Is there room for freer practice? Is it relevant? Are lesson types varied?</div><div class=\"u\">اسأل: هل فيه توازن مهارات؟ هل فيه لغة جديدة وإعادة تدوير؟ هل فيه مساحة لتدريب أحر؟ هل ليه علاقة؟ هل أنواع الدروس متنوعة؟</div>", "n": 40, "i": 11, "a": "tefl2-40-008", "x": "a72f2249"}, {"t": "learn", "h": "<div class=\"u\">How long does each unit take? Does it allow self-study?</div><div class=\"u\">كل وحدة بتاخد وقت قد إيه؟ هل بتسمح بمذاكرة ذاتية؟</div>", "n": 40, "i": 12, "a": "tefl2-40-009", "x": "fcce7fde"}, {"t": "section", "h": "Keep plans and cooperate | احتفظ بالخطط وتعاون", "n": 40, "i": 13}, {"t": "learn", "h": "<div class=\"u\">Plan a rough outline for a few days or a week, then add details. Keep a record and keep lesson plans, so you know what to review and that the course is balanced.</div><div class=\"u\">خطط مخطط عام لكام يوم أو أسبوع وبعدين ضيف التفاصيل. احتفظ بسجل وبخطط الدروس، عشان تعرف إيه المحتاج مراجعة وإن الكورس متوازن.</div>", "n": 40, "i": 14, "a": "tefl2-40-010", "x": "9d6f8844"}, {"t": "learn", "h": "<div class=\"u\">If you share a class with another teacher, coordinate and divide materials fairly. Nothing is worse than students saying we did this last week with the other teacher.</div><div class=\"u\">لو بتشارك فصل مع مدرس تاني، نسّق ووزّع المواد بعدل. مفيش أسوأ من إن الطلاب يقولوا إحنا عملنا ده الأسبوع اللي فات مع المدرس التاني.</div>", "n": 40, "i": 15, "a": "tefl2-40-011", "x": "4cec1594"}, {"t": "learn", "h": "<div class=\"u\">Planning takes a long time at the start of your career. It gets easier with experience.</div><div class=\"u\">التخطيط بياخد وقت طويل في بداية مسيرتك. بيبقى أسهل بالخبرة.</div>", "n": 40, "i": 16, "a": "tefl2-40-012", "x": "eeae2502"}, {"t": "section", "h": "Evaluating a course book | تقييم كتاب", "n": 40, "i": 17}, {"t": "learn", "h": "<div class=\"u\">A checklist covers: level, audience, main or supplementary book, skills balance, method, activities, course length and layout.</div><div class=\"u\">قائمة الفحص بتغطي: المستوى والجمهور وكتاب رئيسي أو مكمّل وتوازن المهارات والمنهج والأنشطة وطول الكورس والتخطيط.</div>", "n": 40, "i": 18, "a": "tefl2-40-013", "x": "53ec3b02"}, {"t": "learn", "h": "<div class=\"u\">And: clarity of language, visuals, photocopiable pages, workbook, teacher's book, audio, video, self-study, homework, durability, cost per student, gaps and usability.</div><div class=\"u\">وكمان: وضوح اللغة والصور وصفحات قابلة للتصوير وكراسة تمارين وكتاب المدرس وصوت وفيديو ومذاكرة ذاتية وواجب ومتانة وتكلفة الطالب والفجوات وسهولة الاستخدام.</div>", "n": 40, "i": 19, "a": "tefl2-40-014", "x": "1bb8885d"}, {"t": "section", "h": "Summary | الخلاصة", "n": 40, "i": 20}, {"t": "learn", "h": "<div class=\"u\">Find needs, find abilities, judge the book, plan ahead, keep records, cooperate.</div><div class=\"u\">اعرف الاحتياجات، اعرف القدرات، احكم على الكتاب، خطط مقدمًا، احتفظ بسجلات، تعاون.</div>", "n": 40, "i": 21, "a": "tefl2-40-015", "x": "3a22c974"}, {"t": "mc", "q": "The first step in planning a course is to:<br>أول خطوة في تخطيط كورس:", "opts": ["find out what students need | تعرف الطلاب محتاجين إيه", "buy a book | تشتري كتاب", "write a test | تكتب اختبار"], "ans": 0, "why": "Needs come first. | الاحتياجات الأول.", "ex": ["Correct. | صح.", "No. | غلط.", "No. | غلط."], "n": 40, "i": 22, "h": ""}, {"t": "mc", "q": "Which tool finds learners' needs?<br>أنهي أداة بتعرّف احتياجات المتعلمين؟", "opts": ["questionnaire | استبيان", "timetable | جدول", "map | خريطة"], "ans": 0, "why": "Also discussion and homework. | وكمان نقاش وواجب.", "ex": ["Correct. | صح.", "No. | غلط.", "No. | غلط."], "n": 40, "i": 23, "h": ""}, {"t": "mc", "q": "Why keep records of lessons?<br>ليه نحتفظ بسجلات الدروس؟", "opts": ["to review and balance the course | للمراجعة وتوازن الكورس", "for decoration | للزينة", "to avoid planning | لتجنب التخطيط"], "ans": 0, "why": "You see what was covered. | بتشوف اللي اتغطى.", "ex": ["Correct. | صح.", "No. | غلط.", "No. | غلط."], "n": 40, "i": 24, "h": ""}, {"t": "mc", "q": "If two teachers share a class they should:<br>لو مدرسين بيشاركوا فصل لازم:", "opts": ["coordinate | ينسقوا", "compete | يتنافسوا", "ignore each other | يتجاهلوا بعض"], "ans": 0, "why": "To avoid repeating lessons. | لتجنب تكرار الدروس.", "ex": ["Correct. | صح.", "No. | غلط.", "No. | غلط."], "n": 40, "i": 25, "h": ""}, {"t": "mc", "q": "To check what students can do you may:<br>عشان تعرف الطلاب يقدروا يعملوا إيه ممكن:", "opts": ["give fluency tasks and written homework | تدّي مهام طلاقة وواجب كتابي", "guess | تخمن", "skip testing | تتجاهل الاختبار"], "ans": 0, "why": "Observe real performance. | لاحظ الأداء الفعلي.", "ex": ["Correct. | صح.", "No. | غلط.", "No. | غلط."], "n": 40, "i": 26, "h": ""}, {"t": "mc", "q": "A good course book has:<br>الكتاب الدراسي الكويس فيه:", "opts": ["balanced skills and recycling | مهارات متوازنة وإعادة تدوير", "only grammar | قواعد بس", "only pictures | صور بس"], "ans": 0, "why": "Balance matters. | التوازن مهم.", "ex": ["Correct. | صح.", "No. | غلط.", "No. | غلط."], "n": 40, "i": 27, "h": ""}, {"t": "tf", "q": "Planning gets easier with experience.<br>التخطيط بيسهل بالخبرة.", "ans": true, "why": "True. | صح.", "ex": ["Correct. | صح.", "Wrong. | غلط."], "n": 40, "i": 28, "h": ""}, {"t": "tf", "q": "You must always choose your own course book.<br>لازم دايمًا تختار كتابك بنفسك.", "ans": false, "why": "False. | غلط.", "ex": ["Wrong. | غلط.", "Correct. | صح."], "n": 40, "i": 29, "h": ""}, {"t": "tf", "q": "Exam needs affect what skills you teach.<br>احتياجات الامتحان بتأثر على المهارات اللي بتدرسها.", "ans": true, "why": "True. | صح.", "ex": ["Correct. | صح.", "Wrong. | غلط."], "n": 40, "i": 30, "h": ""}, {"t": "tf", "q": "You should plan only one lesson at a time with no outline.<br>تخطط درس واحد في الوقت من غير مخطط عام.", "ans": false, "why": "False. | غلط.", "ex": ["Wrong. | غلط.", "Correct. | صح."], "n": 40, "i": 31, "h": ""}, {"t": "tf", "q": "Cost per student matters when evaluating a book.<br>تكلفة الطالب مهمة في تقييم الكتاب.", "ans": true, "why": "True. | صح.", "ex": ["Correct. | صح.", "Wrong. | غلط."], "n": 40, "i": 32, "h": ""}, {"t": "recall", "q": "How can you find out what students need?<br>إزاي تعرف الطلاب محتاجين إيه؟", "a": "Questionnaires, discussions, written homework and asking why they learn English.<br>استبيانات ونقاشات وواجب كتابي وسؤالهم ليه بيتعلموا إنجليزي.", "n": 40, "i": 33, "h": ""}, {"t": "recall", "q": "Give three questions to ask about a course book.<br>اذكر ٣ أسئلة تسأل عن كتاب.", "a": "Skills balance? Recycling? Freer practice? Relevance? Variety? Self-study?<br>توازن مهارات؟ إعادة تدوير؟ تدريب أحر؟ علاقة؟ تنوع؟ مذاكرة ذاتية؟", "n": 40, "i": 34, "h": ""}, {"t": "recall", "q": "Why coordinate with another teacher?<br>ليه تنسق مع مدرس تاني؟", "a": "To avoid repeating lessons and divide materials fairly.<br>لتجنب تكرار الدروس وتوزيع المواد بعدل.", "n": 40, "i": 35, "h": ""}, {"t": "write", "q": "Explain how you would assess a new class (3-4 sentences).<br>اشرح إزاي هتقيّم فصل جديد (٣-٤ جمل).", "key": "tefl2-40:1", "a": "I give a questionnaire about needs. Then I give a speaking task and a short writing task. I also test some grammar to see strengths and gaps.<br>هديهم استبيان عن الاحتياجات. وبعدين مهمة كلام ومهمة كتابة قصيرة. وكمان أختبر شوية قواعد عشان أشوف نقاط القوة والفجوات.", "n": 40, "i": 36, "h": ""}, {"t": "write", "q": "Evaluate a course book using three criteria (3-4 sentences).<br>قيّم كتاب بـ ٣ معايير (٣-٤ جمل).", "key": "tefl2-40:2", "a": "Skills balance: the book has little speaking. Relevance: the topics are about business, not my students. Cost: it is too expensive. So I will add my own speaking tasks.<br>توازن المهارات: الكتاب فيه كلام قليل. العلاقة: المواضيع عن الأعمال مش طلابي. التكلفة: غالي. فهضيف مهام كلام من عندي.", "n": 40, "i": 37, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next: extra lessons from the second guide, starting with the classroom.</div><div class=\"u\">الجاي: دروس إضافية من الدليل التاني، نبدأ بالفصل.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 38}];</script>
