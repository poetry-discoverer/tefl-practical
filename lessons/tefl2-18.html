<h1>كورس TEFL العملي ١٨: تدريس الاستماع</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: متوسط</span><span class="tag">درس ١٨</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl2-18";window.STEPS=[{"t": "section", "h": "Why listening is not one skill | الاستماع مش مهارة واحدة", "n": 18, "i": 0}, {"t": "learn", "h": "<div class=\"u\">We listen in many situations: informal chats, phone calls, social events, radio and TV, announcements at airports and stations.</div><div class=\"u\">بنسمع في مواقف كتير: دردشة عادية، مكالمات، تجمعات، راديو وتلفزيون، إعلانات في المطارات والمحطات.</div>", "n": 18, "i": 1, "a": "tefl2-18-001", "x": "e8648b27"}, {"t": "learn", "h": "<div class=\"u\">Also speeches and lectures, directions and instructions, formal situations like interviews and meetings, and professional advice from doctors, lawyers or teachers.</div><div class=\"u\">وكمان خطب ومحاضرات، اتجاهات وتعليمات، مواقف رسمية زي مقابلات واجتماعات، ونصايح مهنية من دكاترة ومحامين ومدرسين.</div>", "n": 18, "i": 2, "a": "tefl2-18-002", "x": "20913ecb"}, {"t": "learn", "h": "<div class=\"u\">We listen differently in different situations. Listening for a flight time in a noisy airport is not the same as listening to a song.</div><div class=\"u\">بنسمع بشكل مختلف في مواقف مختلفة. الاستماع لميعاد طيارة في مطار زحمة مش زي الاستماع لأغنية.</div>", "n": 18, "i": 3, "a": "tefl2-18-003", "x": "f7f3c1c6"}, {"t": "section", "h": "Intensive and extensive listening | الاستماع المكثف والموسّع", "n": 18, "i": 4}, {"t": "learn", "h": "<div class=\"u\">An announcement needs intensive listening. A story on the radio needs extensive listening.</div><div class=\"u\">الإعلان محتاج استماع مكثف. والحدوتة على الراديو محتاجة استماع موسّع.</div>", "n": 18, "i": 5, "a": "tefl2-18-004", "x": "17abfd37"}, {"t": "learn", "h": "<div class=\"u\">Intensive listening is more challenging. The language is often a little above the learner's level. It is short, and learners hear it several times.</div><div class=\"u\">الاستماع المكثف أصعب. اللغة غالبًا فوق مستوى المتعلم شوية. وهو قصير، والمتعلمين بيسمعوه كذا مرة.</div>", "n": 18, "i": 6, "a": "tefl2-18-005", "x": "335b4347"}, {"t": "learn", "h": "<div class=\"u\">It contains facts learners must pick out, and it is task-based: they listen for a very specific purpose.</div><div class=\"u\">فيه حقايق المتعلمين لازم يلتقطوها، وهو قائم على مهمة: بيسمعوا لغرض محدد جدًا.</div>", "n": 18, "i": 7, "a": "tefl2-18-006", "x": "ec2c06dc"}, {"t": "learn", "h": "<div class=\"u\">Extensive listening is more relaxed. The language is usually within the learner's ability. It is longer, and usually heard once, for general understanding and pleasure.</div><div class=\"u\">الاستماع الموسّع أكتر راحة. اللغة غالبًا في حدود قدرة المتعلم. وهو أطول، وغالبًا بيتسمع مرة واحدة، للفهم العام والمتعة.</div>", "n": 18, "i": 8, "a": "tefl2-18-007", "x": "c87b3111"}, {"t": "learn", "h": "<div class=\"u\">Learners need practice in all listening types, joined with other skills.</div><div class=\"u\">المتعلمين محتاجين تدريب على كل أنواع الاستماع، مدمجة مع المهارات التانية.</div>", "n": 18, "i": 9, "a": "tefl2-18-008", "x": "be37bab5"}, {"t": "section", "h": "Natural listening material | مواد استماع طبيعية", "n": 18, "i": 10}, {"t": "learn", "h": "<div class=\"u\">Listening materials should be as natural as possible. Many modern course books use authentic or semi-authentic recordings.</div><div class=\"u\">مواد الاستماع المفروض تكون طبيعية قد الإمكان. كتب كتير حديثة بتستخدم تسجيلات أصلية أو شبه أصلية.</div>", "n": 18, "i": 11, "a": "tefl2-18-009", "x": "a575c33f"}, {"t": "learn", "h": "<div class=\"u\">The same applies to the teacher's own speech. Slow, unnatural speech does not help a learner who later wants to follow the radio news or make a phone enquiry in English.</div><div class=\"u\">نفس الكلام على كلام المدرس نفسه. الكلام البطيء غير الطبيعي مش بيساعد المتعلم اللي بعدين عايز يتابع أخبار الراديو أو يعمل استفسار بالتليفون بالإنجليزي.</div>", "n": 18, "i": 12, "a": "tefl2-18-010", "x": "858e5d2a"}, {"t": "learn", "h": "<div class=\"u\">Most real listening is informal conversation, with colloquial expressions and fillers, not long uninterrupted speech.</div><div class=\"u\">معظم الاستماع الحقيقي محادثات غير رسمية، فيها تعبيرات عامية وحشو كلام، مش كلام طويل متواصل.</div>", "n": 18, "i": 13, "a": "tefl2-18-011", "x": "0d63e820"}, {"t": "learn", "h": "<div class=\"u\">Fillers can look like meaningless noise to learners. They need to recognise them and understand their function, so they can respond properly.</div><div class=\"u\">الحشو ممكن يبان للمتعلمين ضوضاء بلا معنى. محتاجين يتعرفوا عليه ويفهموا وظيفته، عشان يردوا بشكل مناسب.</div>", "n": 18, "i": 14, "a": "tefl2-18-012", "x": "23c50b82"}, {"t": "learn", "h": "<div class=\"u\">Learners also need lots of practice hearing English sounds, especially sounds that do not exist in their first language.</div><div class=\"u\">المتعلمين كمان محتاجين تدريب كتير على سماع أصوات الإنجليزي، خصوصًا الأصوات اللي مش موجودة في لغتهم الأولى.</div>", "n": 18, "i": 15, "a": "tefl2-18-013", "x": "0e6b44e9"}, {"t": "learn", "h": "<div class=\"u\">For example, Arabic speakers often hear b and p as the same sound, so pubs and pups sound alike. Japanese speakers may hear r and l the same, as in lorry and lolly.</div><div class=\"u\">مثلًا متكلمي العربي غالبًا بيسمعوا b وp نفس الصوت، فـ pubs وpups شبه بعض. ومتكلمي الياباني ممكن يسمعوا r وl نفس الصوت، زي lorry وlolly.</div>", "n": 18, "i": 16, "a": "tefl2-18-014", "x": "a387ce59"}, {"t": "section", "h": "Teaching listening | تدريس الاستماع", "n": 18, "i": 17}, {"t": "learn", "h": "<div class=\"u\">Decide the reason for listening. We rarely listen without a purpose, so learners should know why they listen.</div><div class=\"u\">حدد سبب الاستماع. نادرًا بنسمع من غير هدف، فالمتعلمين لازم يعرفوا ليه بيسمعوا.</div>", "n": 18, "i": 18, "a": "tefl2-18-015", "x": "585f0761"}, {"t": "learn", "h": "<div class=\"u\">Always give a task. Do not just say listen.</div><div class=\"u\">اديّ دايمًا مهمة. ماتقولش اسمعوا وبس.</div>", "n": 18, "i": 19, "a": "tefl2-18-016", "x": "87e4987c"}, {"t": "learn", "h": "<div class=\"u\">Example: write gist questions on the board: how many stations are named? Which ones? What time does the Coventry train leave?</div><div class=\"u\">مثال: اكتب أسئلة الفكرة العامة على السبورة: كام محطة اتذكرت؟ أنهي واحدة؟ الساعة كام القطر المتجه لكوفنتري؟</div>", "n": 18, "i": 20, "a": "tefl2-18-017", "x": "51405523"}, {"t": "learn", "h": "<div class=\"u\">Learners listen, then answer in pairs, then in groups. Then give a chart with more specific questions and play the recording twice more for intensive practice.</div><div class=\"u\">المتعلمين بيسمعوا، وبعدين بيجاوبوا في أزواج، وبعدين في مجموعات. وبعدين اديهم جدول بأسئلة أكتر تحديدًا وشغّل التسجيل مرتين كمان للتدريب المكثف.</div>", "n": 18, "i": 21, "a": "tefl2-18-018", "x": "a28915cc"}, {"t": "section", "h": "Summary | الخلاصة", "n": 18, "i": 22}, {"t": "learn", "h": "<div class=\"u\">Intensive: short, hard, repeated, for facts. Extensive: long, easier, once, for gist and pleasure. Use natural speech, give a purpose and a task.</div><div class=\"u\">مكثف: قصير وصعب ومتكرر للحقايق. موسّع: طويل وأسهل ومرة واحدة للفكرة العامة والمتعة. استخدم كلام طبيعي، واديّ هدف ومهمة.</div>", "n": 18, "i": 23, "a": "tefl2-18-019", "x": "d429c0ae"}, {"t": "mc", "q": "Which skill is more challenging and short?<br>أنهي مهارة أصعب وأقصر؟", "opts": ["intensive listening | استماع مكثف", "extensive listening | استماع موسّع", "speaking | كلام"], "ans": 0, "why": "Intensive listening is task-based and repeated. | الاستماع المكثف قائم على مهمة ومتكرر.", "ex": ["Correct. | صح.", "No. Extensive is longer and more relaxed. | غلط: الموسّع أطول وأكتر راحة.", "No. The question is about listening. | غلط: السؤال عن الاستماع."], "n": 18, "i": 24, "h": ""}, {"t": "mc", "q": "Listening to a story on the radio for pleasure is:<br>الاستماع لحدوتة على الراديو للمتعة هو:", "opts": ["extensive listening | استماع موسّع", "intensive listening | استماع مكثف", "shadowing | ترديد ورا المتكلم"], "ans": 0, "why": "It is relaxed and for general understanding. | مريح وللفهم العام.", "ex": ["Correct. | صح.", "No. Intensive is for specific facts. | غلط: المكثف لحقايق محددة.", "No. Not covered here. | غلط: مش في الدرس ده."], "n": 18, "i": 25, "h": ""}, {"t": "mc", "q": "What happens if the teacher always speaks slowly and unnaturally?<br>إيه اللي بيحصل لو المدرس دايمًا بيتكلم ببطء وبشكل غير طبيعي؟", "opts": ["Learners struggle with real speech like radio news | المتعلمين بيصعب عليهم الكلام الحقيقي زي أخبار الراديو", "Learners learn faster | المتعلمين بيتعلموا أسرع", "Nothing | مفيش حاجة"], "ans": 0, "why": "They are not prepared for natural speech. | مش متجهزين للكلام الطبيعي.", "ex": ["Correct. | صح.", "No. It does not help. | غلط: مش بيساعد.", "No. It has an effect. | غلط: له تأثير."], "n": 18, "i": 26, "h": ""}, {"t": "mc", "q": "What should the teacher give before a listening activity?<br>إيه اللي المدرس لازم يديه قبل نشاط الاستماع؟", "opts": ["a purpose and a task | هدف ومهمة", "a test | اختبار", "the full text | النص الكامل"], "ans": 0, "why": "We do not listen without a purpose. | مابنسمعش من غير هدف.", "ex": ["Correct. | صح.", "No. Give a task, not a test. | غلط: اديّ مهمة مش اختبار.", "No. That is not listening. | غلط: ده مش استماع."], "n": 18, "i": 27, "h": ""}, {"t": "mc", "q": "Why are fillers important to teach?<br>ليه حشو الكلام مهم نعلّمه؟", "opts": ["Learners must recognise their function in real conversation | المتعلمين لازم يتعرفوا على وظيفته في المحادثة الحقيقية", "They are formal | رسميين", "They are grammar rules | قواعد نحو"], "ans": 0, "why": "They look like noise but have a function. | بيبانوا ضوضاء بس ليهم وظيفة.", "ex": ["Correct. | صح.", "No. They are informal. | غلط: غير رسميين.", "No. They are conversational. | غلط: محادثة."], "n": 18, "i": 28, "h": ""}, {"t": "mc", "q": "Pubs and pups may sound alike to Arabic speakers because:<br>pubs وpups ممكن يبانوا شبه بعض لمتكلمي العربي لأن:", "opts": ["Arabic does not distinguish b and p in the same way | العربي مابيفرّقش بين b وp بنفس الطريقة", "they are the same word | هما نفس الكلمة", "English has no b | الإنجليزي مفيهوش b"], "ans": 0, "why": "First-language sounds affect listening. | أصوات اللغة الأولى بتأثر على الاستماع.", "ex": ["Correct. | صح.", "No. They are different words. | غلط: كلمتين مختلفتين.", "No. English has b. | غلط: الإنجليزي فيه b."], "n": 18, "i": 29, "h": ""}, {"t": "tf", "q": "Intensive listening material is usually heard several times.<br>مادة الاستماع المكثف غالبًا بتتسمع كذا مرة.", "ans": true, "why": "True. | صح.", "ex": ["Correct. | صح.", "Wrong. It is repeated. | غلط: بتتكرر."], "n": 18, "i": 30, "h": ""}, {"t": "tf", "q": "Extensive listening is mostly for specific facts.<br>الاستماع الموسّع غالبًا لحقايق محددة.", "ans": false, "why": "False. It is for general understanding. | غلط. هو للفهم العام.", "ex": ["Wrong. That is intensive. | غلط: ده المكثف.", "Correct. | صح."], "n": 18, "i": 31, "h": ""}, {"t": "tf", "q": "Learners should simply be told to listen, with no task.<br>المتعلمين يتقالهم اسمعوا بس من غير مهمة.", "ans": false, "why": "False. A task is needed. | غلط. محتاجين مهمة.", "ex": ["Wrong. Give a task. | غلط: اديّ مهمة.", "Correct. | صح."], "n": 18, "i": 32, "h": ""}, {"t": "tf", "q": "Most real listening is informal conversation.<br>معظم الاستماع الحقيقي محادثات غير رسمية.", "ans": true, "why": "True. | صح.", "ex": ["Correct. | صح.", "Wrong. It is mostly informal. | غلط: معظمه غير رسمي."], "n": 18, "i": 33, "h": ""}, {"t": "tf", "q": "Authentic listening materials should be as natural as possible.<br>مواد الاستماع الأصلية المفروض تكون طبيعية قد الإمكان.", "ans": true, "why": "True. | صح.", "ex": ["Correct. | صح.", "Wrong. Natural is the aim. | غلط: الطبيعي هو الهدف."], "n": 18, "i": 34, "h": ""}, {"t": "recall", "q": "Name five listening situations.<br>سمّي ٥ مواقف استماع.", "a": "Informal conversations, phone calls, radio or TV, airport announcements, lectures, directions, interviews, professional advice.<br>محادثات عادية، مكالمات، راديو أو تلفزيون، إعلانات مطار، محاضرات، اتجاهات، مقابلات، نصايح مهنية.", "n": 18, "i": 35, "h": ""}, {"t": "recall", "q": "What are the two main listening skills we teach?<br>إيه مهارتين الاستماع الأساسيتين اللي بندرّسهم؟", "a": "Intensive and extensive listening.<br>استماع مكثف واستماع موسّع.", "n": 18, "i": 36, "h": ""}, {"t": "recall", "q": "Why should the teacher use natural speech?<br>ليه المدرس يستخدم كلام طبيعي؟", "a": "Slow unnatural speech does not prepare learners for real listening, like radio or phone calls.<br>الكلام البطيء غير الطبيعي مش بيجهّز المتعلمين للاستماع الحقيقي، زي الراديو والمكالمات.", "n": 18, "i": 37, "h": ""}, {"t": "write", "q": "Compare intensive and extensive listening (3-4 sentences).<br>قارن بين الاستماع المكثف والموسّع (٣-٤ جمل).", "key": "tefl2-18:1", "a": "Intensive listening is short and challenging, with language above the level of the learners. They hear it several times to find specific facts. Extensive listening is longer and relaxed, within the learners' ability, and heard once for the general idea and enjoyment.<br>الاستماع المكثف قصير وصعب، بلغة فوق مستوى المتعلمين. بيسمعوه كذا مرة لإيجاد حقايق محددة. الاستماع الموسّع أطول ومريح، في حدود قدرة المتعلمين، وبيتسمع مرة واحدة للفكرة العامة والمتعة.", "n": 18, "i": 38, "h": ""}, {"t": "write", "q": "Describe how to plan a listening activity (3-4 sentences).<br>اوصف إزاي تخطط لنشاط استماع (٣-٤ جمل).", "key": "tefl2-18:2", "a": "First decide why learners will listen. Write gist questions on the board and play the recording. Learners answer in pairs, then in groups. Then give a chart with detailed questions and play the recording again for intensive listening.<br>الأول حدد ليه المتعلمين هيسمعوا. اكتب أسئلة الفكرة العامة على السبورة وشغّل التسجيل. المتعلمين بيجاوبوا في أزواج وبعدين مجموعات. وبعدين اديهم جدول بأسئلة تفصيلية وشغّل التسجيل تاني للاستماع المكثف.", "n": 18, "i": 39, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: how reading develops, step by step.</div><div class=\"u\">الدرس الجاي: إزاي القراءة بتتطور خطوة خطوة.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 40}];</script>
