<h1>كورس TEFL العملي ٣٢: محتويات خطة الدرس</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: متوسط</span><span class="tag">درس ٣٢</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl2-32";window.STEPS=[{"t": "section", "h": "Why plan | ليه نخطط", "n": 32, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Lessons last from 45 minutes to two hours or more. Planning avoids wasted time and gives learners the most benefit.</div><div class=\"u\">الدروس بتستمر من ٤٥ دقيقة لساعتين أو أكتر. التخطيط بيمنع ضياع الوقت وبيدّي المتعلمين أقصى فايدة.</div>", "n": 32, "i": 1, "a": "tefl2-32-001", "x": "96af830a"}, {"t": "learn", "h": "<div class=\"u\">A plan stops the end bell from interrupting an activity. That interruption makes learners feel frustrated and unsuccessful.</div><div class=\"u\">الخطة بتمنع جرس النهاية من إنه يقاطع نشاط. المقاطعة دي بتخلي المتعلمين يحسوا بإحباط وعدم نجاح.</div>", "n": 32, "i": 2, "a": "tefl2-32-002", "x": "8e2f579a"}, {"t": "learn", "h": "<div class=\"u\">Planning also makes sure you have all the equipment you need.</div><div class=\"u\">والتخطيط كمان بيتأكد إن معاك كل المعدات اللازمة.</div>", "n": 32, "i": 3, "a": "tefl2-32-003", "x": "a38d8ee9"}, {"t": "section", "h": "Variety and participation | التنوع والمشاركة", "n": 32, "i": 4}, {"t": "learn", "h": "<div class=\"u\">If every lesson uses the same kind of activity, learners get bored and lose focus and motivation. So do teachers. This matters most with young learners and long classes.</div><div class=\"u\">لو كل درس بيستخدم نفس نوع النشاط، المتعلمين بيملوا ويفقدوا التركيز والحماس. والمدرسين كمان. ده أهم مع الأطفال والفصول الطويلة.</div>", "n": 32, "i": 5, "a": "tefl2-32-004", "x": "5d7902d2"}, {"t": "learn", "h": "<div class=\"u\">Keep teacher talk to a minimum. Check the plan beforehand and add more learner participation if needed.</div><div class=\"u\">قلل كلام المدرس لأقل حد. راجع الخطة قبل الدرس وزوّد مشاركة المتعلمين لو لزم.</div>", "n": 32, "i": 6, "a": "tefl2-32-005", "x": "148b9fb5"}, {"t": "section", "h": "What a plan contains | الخطة فيها إيه", "n": 32, "i": 7}, {"t": "learn", "h": "<div class=\"u\">Basic details: teacher name, class name, date, level, number of learners and lesson time.</div><div class=\"u\">التفاصيل الأساسية: اسم المدرس واسم الفصل والتاريخ والمستوى وعدد المتعلمين ومدة الدرس.</div>", "n": 32, "i": 8, "a": "tefl2-32-006", "x": "ef7ab3d6"}, {"t": "learn", "h": "<div class=\"u\">Aims: structure and skills. Assumptions: what learners already know. Anticipated problems, such as pronunciation, meaning or mother tongue interference.</div><div class=\"u\">الأهداف: التراكيب والمهارات. الافتراضات: اللي المتعلمين عارفينه. المشاكل المتوقعة، زي النطق أو المعنى أو تأثير اللغة الأم.</div>", "n": 32, "i": 9, "a": "tefl2-32-007", "x": "e17f3fd1"}, {"t": "learn", "h": "<div class=\"u\">Materials needed, the stages, classroom management such as seating and grouping, and approximate timing for each stage.</div><div class=\"u\">المواد المطلوبة والمراحل وإدارة الفصل زي الجلوس والتجميع والتوقيت التقريبي لكل مرحلة.</div>", "n": 32, "i": 10, "a": "tefl2-32-008", "x": "bee62190"}, {"t": "learn", "h": "<div class=\"u\">Board plans and interaction. Interaction shows who works with whom: teacher to students, student to student.</div><div class=\"u\">خطط السبورة والتفاعل. التفاعل بيوضح مين بيشتغل مع مين: مدرس لطلاب أو طالب لطالب.</div>", "n": 32, "i": 11, "a": "tefl2-32-009", "x": "6fd27f2a"}, {"t": "section", "h": "A plan template | نموذج خطة", "n": 32, "i": 12}, {"t": "learn", "h": "<div class=\"u\">A simple template has boxes for: teacher, class, level, time, number of students, structural aim, skills aim, assumptions and problems.</div><div class=\"u\">النموذج البسيط فيه خانات لـ: المدرس والفصل والمستوى والوقت وعدد الطلاب وهدف التراكيب وهدف المهارات والافتراضات والمشاكل.</div>", "n": 32, "i": 13, "a": "tefl2-32-010", "x": "fd25ed97"}, {"t": "learn", "h": "<div class=\"u\">Then: classroom management, materials and aids, and a table with stage, board work, interaction, time and comments, followed by the details of each activity.</div><div class=\"u\">وبعدين: إدارة الفصل والمواد والوسائل، وجدول فيه المرحلة وشغل السبورة والتفاعل والوقت والتعليقات، وبعده تفاصيل كل نشاط.</div>", "n": 32, "i": 14, "a": "tefl2-32-011", "x": "749ec507"}, {"t": "section", "h": "Summary | الخلاصة", "n": 32, "i": 15}, {"t": "learn", "h": "<div class=\"u\">A good plan names aims, predicts problems, lists materials, sets timings and plans interaction. It keeps lessons varied and learner centred.</div><div class=\"u\">الخطة الكويسة بتحدد الأهداف وبتتوقع المشاكل وبتسرد المواد وبتحط توقيتات وبتخطط للتفاعل. بتحافظ على تنوع الدروس وتركيزها على المتعلم.</div>", "n": 32, "i": 16, "a": "tefl2-32-012", "x": "d0a900a9"}, {"t": "mc", "q": "Why plan a lesson?<br>ليه نخطط درس؟", "opts": ["to avoid wasting time | عشان منضيّعش وقت", "to talk more | عشان نتكلم أكتر", "to skip materials | عشان نتجاهل المواد"], "ans": 0, "why": "It uses time well. | بيستخدم الوقت كويس.", "ex": ["Correct. | صح.", "No. | غلط.", "No. | غلط."], "n": 32, "i": 17, "h": ""}, {"t": "mc", "q": "An assumption in a plan is:<br>الافتراض في الخطة هو:", "opts": ["what learners already know | اللي المتعلمين عارفينه", "a test | اختبار", "a game | لعبة"], "ans": 0, "why": "Pre-knowledge. | معرفة سابقة.", "ex": ["Correct. | صح.", "No. | غلط.", "No. | غلط."], "n": 32, "i": 18, "h": ""}, {"t": "mc", "q": "Interaction in a plan shows:<br>التفاعل في الخطة بيوضح:", "opts": ["who works with whom | مين بيشتغل مع مين", "the date | التاريخ", "the book | الكتاب"], "ans": 0, "why": "For example T to Ss. | مثلًا مدرس لطلاب.", "ex": ["Correct. | صح.", "No. | غلط.", "No. | غلط."], "n": 32, "i": 19, "h": ""}, {"t": "mc", "q": "Same activity every lesson causes:<br>نفس النشاط كل درس بيسبب:", "opts": ["boredom | الملل", "progress | تقدم", "silence | صمت"], "ans": 0, "why": "Variety is needed. | التنوع مطلوب.", "ex": ["Correct. | صح.", "No. | غلط.", "No. | غلط."], "n": 32, "i": 20, "h": ""}, {"t": "mc", "q": "Teacher talk should be:<br>كلام المدرس لازم يبقى:", "opts": ["kept to a minimum | أقل ما يمكن", "maximum | أقصى ما يمكن", "constant | مستمر"], "ans": 0, "why": "More learner participation is better. | مشاركة المتعلمين أحسن.", "ex": ["Correct. | صح.", "No. | غلط.", "No. | غلط."], "n": 32, "i": 21, "h": ""}, {"t": "mc", "q": "An example of an anticipated problem is:<br>مثال على مشكلة متوقعة:", "opts": ["mother tongue interference in pronunciation | تأثير اللغة الأم في النطق", "the date | التاريخ", "the room number | رقم الغرفة"], "ans": 0, "why": "You predict learner difficulty. | بتتوقع صعوبة المتعلمين.", "ex": ["Correct. | صح.", "No. | غلط.", "No. | غلط."], "n": 32, "i": 22, "h": ""}, {"t": "tf", "q": "Lessons must always be 45 minutes.<br>الدروس لازم تبقى ٤٥ دقيقة دايمًا.", "ans": false, "why": "False. They vary. | غلط. بتتفاوت.", "ex": ["Wrong. | غلط.", "Correct. | صح."], "n": 32, "i": 23, "h": ""}, {"t": "tf", "q": "A plan should include timings.<br>الخطة لازم تتضمن توقيتات.", "ans": true, "why": "True. | صح.", "ex": ["Correct. | صح.", "Wrong. | غلط."], "n": 32, "i": 24, "h": ""}, {"t": "tf", "q": "A plan should list needed materials.<br>الخطة لازم تسرد المواد.", "ans": true, "why": "True. | صح.", "ex": ["Correct. | صح.", "Wrong. | غلط."], "n": 32, "i": 25, "h": ""}, {"t": "tf", "q": "The end bell cutting off an activity helps learners feel successful.<br>جرس النهاية وهو بيقطع نشاط بيخلي المتعلمين يحسوا بنجاح.", "ans": false, "why": "False. | غلط.", "ex": ["Wrong. | غلط.", "Correct. | صح."], "n": 32, "i": 26, "h": ""}, {"t": "tf", "q": "Board plans can be part of a lesson plan.<br>خطط السبورة ممكن تبقى جزء من خطة الدرس.", "ans": true, "why": "True. | صح.", "ex": ["Correct. | صح.", "Wrong. | غلط."], "n": 32, "i": 27, "h": ""}, {"t": "recall", "q": "Name five items in a lesson plan.<br>سمّي ٥ عناصر في خطة الدرس.", "a": "Teacher, class, date, level, number of learners, time, aims, assumptions, problems, materials, stages, timing, board plan, interaction.<br>المدرس والفصل والتاريخ والمستوى وعدد المتعلمين والوقت والأهداف والافتراضات والمشاكل والمواد والمراحل والتوقيت وخطة السبورة والتفاعل.", "n": 32, "i": 28, "h": ""}, {"t": "recall", "q": "Why vary activities?<br>ليه ننوّع الأنشطة؟", "a": "To avoid boredom and keep focus and motivation.<br>لتجنب الملل والحفاظ على التركيز والحماس.", "n": 32, "i": 29, "h": ""}, {"t": "recall", "q": "What does interaction show?<br>التفاعل بيوضح إيه؟", "a": "Who works with whom, such as teacher to students or students to students.<br>مين بيشتغل مع مين، زي مدرس لطلاب أو طلاب لطلاب.", "n": 32, "i": 30, "h": ""}, {"t": "write", "q": "Explain why timing matters in a plan (3-4 sentences).<br>اشرح ليه التوقيت مهم في الخطة (٣-٤ جمل).", "key": "tefl2-32:1", "a": "Timing keeps the lesson on track. It stops the bell from interrupting an activity. Learners then finish tasks and feel successful.<br>التوقيت بيخلي الدرس ماشي صح. وبيمنع الجرس من مقاطعة نشاط. فالمتعلمين بيخلصوا المهام ويحسوا بنجاح.", "n": 32, "i": 31, "h": ""}, {"t": "write", "q": "Describe an anticipated problem and what you would do (3-4 sentences).<br>اوصف مشكلة متوقعة وهتعمل إيه (٣-٤ جمل).", "key": "tefl2-32:2", "a": "Learners may say used to as /ju:zd/. I will model the sound /ju:st/ clearly on the board. Then we drill it as a class.<br>المتعلمين ممكن يقولوا used to بصوت /ju:zd/. هنطق الصوت /ju:st/ بوضوح وأكتبه على السبورة. وبعدين نتدرب عليه كفصل.", "n": 32, "i": 32, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: lesson stages, PPP and ARC.</div><div class=\"u\">الدرس الجاي: مراحل الدرس، PPP وARC.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 33}];</script>
