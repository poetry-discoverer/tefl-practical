<h1>كورس TEFL العملي ١: ليه الإنجليزي؟ اللغة والعالم</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ١</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script src="../audio/manifest.js" onerror="void 0"></script>
<script>window.LESSON_ID="tefl2-01";window.STEPS=[{"t": "section", "h": "Why teach English? | ليه نعلّم إنجليزي؟", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Long ago, Latin was the most studied language in the world. Today, English has that place.</div><div class=\"u\">زمان اللاتيني كان أكتر لغة بتتدرس في العالم. النهارده الإنجليزي هو اللي واخد المكان ده.</div>", "n": 1, "i": 1, "a": "tefl2-01-001", "x": "2d737220"}, {"t": "learn", "h": "<div class=\"u\">Every year, many people travel to Britain just to learn English. They study in universities, in language schools, and even on small holiday courses.</div><div class=\"u\">كل سنة ناس كتير بتسافر بريطانيا بس عشان تتعلم إنجليزي. بيدرسوا في الجامعات وفي معاهد اللغات وحتى في كورسات إجازة صغيرة.</div>", "n": 1, "i": 2, "a": "tefl2-01-002", "x": "9943fbaa"}, {"t": "learn", "h": "<div class=\"u\">More than a thousand organisations offer these courses. Some are big. Some are very small.</div><div class=\"u\">أكتر من ألف جهة بتقدم الكورسات دي. بعضها كبير وبعضها صغير جدًا.</div>", "n": 1, "i": 3, "a": "tefl2-01-003", "x": "a873b7a8"}, {"t": "learn", "h": "<div class=\"u\">One popular choice is the home stay. The student lives with a family, and the host also teaches. It is usually one to one, but a small group is possible.</div><div class=\"u\">اختيار مشهور هو الإقامة في بيت أسرة. الطالب بيعيش مع أسرة والمضيف هو كمان اللي بيدرّس. غالبًا واحد لواحد، وممكن مجموعة صغيرة.</div>", "n": 1, "i": 4, "a": "tefl2-01-004", "x": "1e54674f"}, {"t": "learn", "h": "<div class=\"u\">Some agencies connect future host teachers with students who want this kind of stay.</div><div class=\"u\">فيه وكالات بتوصّل المدرسين المضيفين اللي لسه هيبدأوا بالطلبة اللي عايزين الإقامة دي.</div>", "n": 1, "i": 5, "a": "tefl2-01-005", "x": "034ee8d8"}, {"t": "learn", "h": "<div class=\"u\">Millions of other students learn English in their own countries. So the world needs more English teachers than ever before.</div><div class=\"u\">ملايين تانيين من الطلبة بيتعلموا إنجليزي في بلادهم. فالعالم محتاج مدرسين إنجليزي أكتر من أي وقت فات.</div>", "n": 1, "i": 6, "a": "tefl2-01-006", "x": "fd9c2d61"}, {"t": "learn", "h": "<div class=\"u\">Schools hire teachers every week. Demand grew very fast in Eastern Europe, and also in faraway places like Thailand, Japan and the Middle East.</div><div class=\"u\">المدارس بتوظّف مدرسين كل أسبوع. الطلب زاد بسرعة كبيرة في شرق أوروبا، وكمان في أماكن بعيدة زي تايلاند واليابان والشرق الأوسط.</div>", "n": 1, "i": 7, "a": "tefl2-01-007", "x": "c51890b9"}, {"t": "section", "h": "Facts about English | حقايق عن الإنجليزي", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">Note: these numbers are older estimates, so treat them as rough. About 300 million people speak English as their first language.</div><div class=\"u\">ملحوظة: الأرقام دي تقديرات قديمة، فاعتبرها تقريبية. حوالي ٣٠٠ مليون شخص لغتهم الأولى الإنجليزي.</div>", "n": 1, "i": 9, "a": "tefl2-01-008", "x": "1055c6eb"}, {"t": "learn", "h": "<div class=\"u\">Another 300 million use it as a second language. About 100 million more speak it well as a foreign language.</div><div class=\"u\">٣٠٠ مليون كمان بيستخدموه كلغة تانية. وحوالي ١٠٠ مليون زيادة بيتكلموه كويس كلغة أجنبية.</div>", "n": 1, "i": 10, "a": "tefl2-01-009", "x": "ee767b14"}, {"t": "learn", "h": "<div class=\"u\">English is an official or semi-official language in more than 60 countries.</div><div class=\"u\">الإنجليزي لغة رسمية أو شبه رسمية في أكتر من ٦٠ دولة.</div>", "n": 1, "i": 11, "a": "tefl2-01-010", "x": "7131db60"}, {"t": "learn", "h": "<div class=\"u\">More than two thirds of the world's scientists write in English. In the old figures, over 80 percent of stored digital information was in English.</div><div class=\"u\">أكتر من تلتين علماء العالم بيكتبوا بالإنجليزي. وفي الأرقام القديمة، أكتر من ٨٠٪ من المعلومات الرقمية المخزّنة كانت بالإنجليزي.</div>", "n": 1, "i": 12, "a": "tefl2-01-011", "x": "d9dca8ee"}, {"t": "learn", "h": "<div class=\"u\">About 50 million children study English in primary school. At secondary level, another 80 million join them.</div><div class=\"u\">حوالي ٥٠ مليون طفل بيدرسوا إنجليزي في المرحلة الابتدائية. وفي الثانوي بينضم ليهم ٨٠ مليون تانيين.</div>", "n": 1, "i": 13, "a": "tefl2-01-012", "x": "f2420a10"}, {"t": "learn", "h": "<div class=\"u\">English is the main language of books, newspapers, airports, air-traffic control, advertising and business.</div><div class=\"u\">الإنجليزي هو اللغة الأساسية للكتب والجرايد والمطارات وتوجيه الطيران والإعلان والتجارة.</div>", "n": 1, "i": 14, "a": "tefl2-01-013", "x": "eba55ee8"}, {"t": "learn", "h": "<div class=\"u\">It is also the main language of medicine, technology, diplomacy, sports, pop music and academic conferences.</div><div class=\"u\">وهو كمان اللغة الأساسية للطب والتكنولوجيا والدبلوماسية والرياضة وأغاني البوب والمؤتمرات العلمية.</div>", "n": 1, "i": 15, "a": "tefl2-01-014", "x": "eed83fa3"}, {"t": "learn", "h": "<div class=\"u\">In the USA alone, around 500,000 foreign students register every year to study. More than two thirds of the world's mail is written in English.</div><div class=\"u\">في أمريكا لوحدها، حوالي ٥٠٠ ألف طالب أجنبي بيسجّلوا كل سنة للدراسة. وأكتر من تلتين بريد العالم بيتكتب بالإنجليزي.</div>", "n": 1, "i": 16, "a": "tefl2-01-015", "x": "00a0d997"}, {"t": "learn", "h": "<div class=\"u\">English has the highest total number of speakers. Chinese is second, some way behind.</div><div class=\"u\">الإنجليزي عنده أكبر عدد متكلمين إجمالًا. والصيني تاني، بفارق ملحوظ.</div>", "n": 1, "i": 17, "a": "tefl2-01-016", "x": "f96b252a"}, {"t": "section", "h": "Where English comes from | الإنجليزي جه منين", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">English began in the Indo-European family of languages. It is a Germanic language, a close relative of German, Dutch, Swedish and Icelandic.</div><div class=\"u\">الإنجليزي بدأ من عيلة اللغات الهندو أوروبية. وهو لغة جرمانية، قريب من الألماني والهولندي والسويدي والأيسلندي.</div>", "n": 1, "i": 19, "a": "tefl2-01-017", "x": "aad29e9f"}, {"t": "learn", "h": "<div class=\"u\">But English also borrowed a huge number of words from French and Latin, which are Romance languages. So it has a Germanic base and a big Romance influence.</div><div class=\"u\">بس الإنجليزي كمان استعار عدد ضخم من الكلمات من الفرنسي واللاتيني، وهما لغات رومانسية. يعني أساسه جرماني وفيه تأثير رومانسي كبير.</div>", "n": 1, "i": 20, "a": "tefl2-01-018", "x": "39beca4b"}, {"t": "learn", "h": "<div class=\"u\">Word meanings change over time. Sly once meant wise. Naughty once meant having nothing. Villain once meant a farm worker.</div><div class=\"u\">معاني الكلمات بتتغيّر مع الوقت. كلمة sly كانت معناها حكيم. وnaughty كانت معناها معندوش حاجة. وvillain كانت معناها عامل في مزرعة.</div>", "n": 1, "i": 21, "a": "tefl2-01-019", "x": "760e84c1"}, {"t": "learn", "h": "<div class=\"u\">English also borrows words from many languages: ballot from Italian, garage from French, kiosk from Turkish, tycoon from Japanese, slim from Dutch.</div><div class=\"u\">والإنجليزي كمان بيستعير كلمات من لغات كتير: ballot من الإيطالي، garage من الفرنسي، kiosk من التركي، tycoon من الياباني، slim من الهولندي.</div>", "n": 1, "i": 22, "a": "tefl2-01-020", "x": "13209b62"}, {"t": "learn", "h": "<div class=\"u\">Sofa came from Arabic. Marmalade came from Portuguese. Window came from an old Scandinavian language.</div><div class=\"u\">كلمة sofa جت من العربي. وmarmalade من البرتغالي. وwindow من لغة اسكندنافية قديمة.</div>", "n": 1, "i": 23, "a": "tefl2-01-021", "x": "5ecf16b1"}, {"t": "section", "h": "Why do learners want English? | ليه المتعلمين عايزين الإنجليزي؟", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">Think about it: English helps with jobs, travel, study, science and the internet. This is why learners often want it badly.</div><div class=\"u\">فكّر في الموضوع: الإنجليزي بيساعد في الشغل والسفر والدراسة والعلوم والإنترنت. عشان كده المتعلمين غالبًا عايزينه جدًا.</div>", "n": 1, "i": 25, "a": "tefl2-01-022", "x": "6b3c7848"}, {"t": "learn", "h": "<div class=\"u\">For a teacher, this means demand is high, motivation can be strong, and your students often have a clear personal reason to learn.</div><div class=\"u\">بالنسبة للمدرس، ده معناه إن الطلب عالي، والدافع ممكن يبقى قوي، وطلبتك غالبًا عندهم سبب شخصي واضح للتعلم.</div>", "n": 1, "i": 26, "a": "tefl2-01-023", "x": "cded3866"}, {"t": "learn", "h": "<div class=\"u\">Summary: English is the world's most widely studied language. It is spoken by hundreds of millions, used in science and business, and its roots are Germanic with Romance influence.</div><div class=\"u\">الخلاصة: الإنجليزي أكتر لغة بتتدرس في العالم. بيتكلمه مئات الملايين، وبيُستخدم في العلوم والتجارة، وجذوره جرمانية بتأثير رومانسي.</div>", "n": 1, "i": 27, "a": "tefl2-01-024", "x": "587453ff"}, {"t": "mc", "q": "Is the teaching of English around the world growing or shrinking?<br>التدريس الإنجليزي حوالين العالم بيزيد ولا بيقل؟", "opts": ["Growing | بيزيد", "Shrinking | بيقل", "It stays the same | ثابت"], "ans": 0, "why": "Demand for English teachers has never been higher. | الطلب على مدرسين الإنجليزي عمره ما كان أعلى من كده.", "ex": ["Correct. | صح.", "No. Schools hire all the time. | غلط: المدارس بتوظّف طول الوقت.", "No. It is growing. | غلط: بيزيد."], "n": 1, "i": 28, "h": ""}, {"t": "mc", "q": "Which language was the most studied about 500 years ago?<br>أنهي لغة كانت أكتر لغة بتتدرس من حوالي ٥٠٠ سنة؟", "opts": ["Latin | اللاتيني", "English | الإنجليزي", "Chinese | الصيني"], "ans": 0, "why": "Latin held that place; today it is English. | اللاتيني كان واخد المكان ده، والنهارده الإنجليزي.", "ex": ["Correct. | صح.", "No. English has that place today. | غلط: الإنجليزي هو اللي واخده النهارده.", "No. Chinese is second in total speakers today. | غلط: الصيني تاني في عدد المتكلمين النهارده."], "n": 1, "i": 29, "h": ""}, {"t": "mc", "q": "English belongs to which language family?<br>الإنجليزي بيتبع أنهي عيلة لغات؟", "opts": ["Indo-European | هندو أوروبية", "Semitic | سامية", "Sino-Tibetan | صينية تبتية"], "ans": 0, "why": "English is Indo-European, in its Germanic branch. | الإنجليزي هندو أوروبي، من الفرع الجرماني.", "ex": ["Correct. | صح.", "No. Arabic and Hebrew are Semitic. | غلط: العربي والعبري سامية.", "No. Chinese belongs there. | غلط: الصيني هو اللي منها."], "n": 1, "i": 30, "h": ""}, {"t": "mc", "q": "Which of these is a Germanic language like English?<br>أنهي دي لغة جرمانية زي الإنجليزي؟", "opts": ["Dutch | الهولندي", "French | الفرنسي", "Turkish | التركي"], "ans": 0, "why": "Dutch, German and Swedish are Germanic. French is Romance. | الهولندي والألماني والسويدي جرمانية. الفرنسي رومانسي.", "ex": ["Correct. | صح.", "No. French is a Romance language. | غلط: الفرنسي لغة رومانسية.", "No. Turkish is not even Indo-European. | غلط: التركي مش حتى هندو أوروبي."], "n": 1, "i": 31, "h": ""}, {"t": "mc", "q": "The word sofa came into English from:<br>كلمة sofa دخلت الإنجليزي من:", "opts": ["Arabic | العربي", "Japanese | الياباني", "Dutch | الهولندي"], "ans": 0, "why": "Sofa is an Arabic loanword. | sofa كلمة مستعارة من العربي.", "ex": ["Correct. | صح.", "No. Tycoon is from Japanese. | غلط: tycoon هي اللي من الياباني.", "No. Slim is from Dutch. | غلط: slim هي اللي من الهولندي."], "n": 1, "i": 32, "h": ""}, {"t": "mc", "q": "In a home stay, the student usually:<br>في الإقامة العائلية، الطالب غالبًا:", "opts": ["lives with a host family who also teaches | بيعيش مع أسرة مضيفة بتدرّس كمان", "lives in a school dormitory | بيعيش في سكن المدرسة", "studies only online | بيدرس أونلاين بس"], "ans": 0, "why": "The host family is also the teacher, usually one to one. | الأسرة المضيفة هي كمان المدرّس، غالبًا واحد لواحد.", "ex": ["Correct. | صح.", "No. That is a different kind of course. | غلط: ده نوع تاني من الكورسات.", "No. A home stay is in a real home. | غلط: الإقامة العائلية في بيت حقيقي."], "n": 1, "i": 33, "h": ""}, {"t": "tf", "q": "English is an official or semi-official language in more than 60 countries.<br>الإنجليزي لغة رسمية أو شبه رسمية في أكتر من ٦٠ دولة.", "ans": true, "why": "True, according to the older figures. | صح، حسب الأرقام الأقدم.", "ex": ["Correct. | صح.", "Wrong. The figure is above 60. | غلط: الرقم فوق ٦٠."], "n": 1, "i": 34, "h": ""}, {"t": "tf", "q": "Word meanings never change over time.<br>معاني الكلمات مابتتغيرش مع الوقت أبدًا.", "ans": false, "why": "False. Sly used to mean wise and naughty used to mean having nothing. | غلط. كلمة sly كانت معناها حكيم وnaughty كانت معناها معندوش حاجة.", "ex": ["Wrong. Meanings change. | غلط: المعاني بتتغيّر.", "Correct. | صح."], "n": 1, "i": 35, "h": ""}, {"t": "tf", "q": "English has only Germanic roots and no influence from other languages.<br>الإنجليزي جذوره جرمانية بس ومفيش تأثير من لغات تانية.", "ans": false, "why": "False. It also borrowed many words from French, Latin and other languages. | غلط. استعار كلمات كتير من الفرنسي واللاتيني ولغات تانية.", "ex": ["Wrong. It borrowed a lot. | غلط: استعار كتير.", "Correct. | صح."], "n": 1, "i": 36, "h": ""}, {"t": "tf", "q": "About two thirds of the world's mail was written in English, in the older figures.<br>حوالي تلتين بريد العالم كان بيتكتب بالإنجليزي، في الأرقام الأقدم.", "ans": true, "why": "True, one of the facts showing how widely it is used. | صح، واحدة من الحقايق اللي بتوضّح انتشاره.", "ex": ["Correct. | صح.", "Wrong. The figure is two thirds. | غلط: الرقم تلتين."], "n": 1, "i": 37, "h": ""}, {"t": "tf", "q": "Chinese has more total speakers than English.<br>الصيني عنده متكلمين إجمالًا أكتر من الإنجليزي.", "ans": false, "why": "False in these figures: English is first and Chinese comes second. | غلط في الأرقام دي: الإنجليزي الأول والصيني التاني.", "ex": ["Wrong. English is first. | غلط: الإنجليزي الأول.", "Correct. | صح."], "n": 1, "i": 38, "h": ""}, {"t": "recall", "q": "Name three areas where English is the main language of communication.<br>اذكر ٣ مجالات الإنجليزي فيها هو لغة التواصل الأساسية.", "a": "Any three: science, business, medicine, technology, air-traffic control, diplomacy, sports, pop music, academic conferences.<br>أي ٣: العلوم، التجارة، الطب، التكنولوجيا، توجيه الطيران، الدبلوماسية، الرياضة، أغاني البوب، المؤتمرات العلمية.", "n": 1, "i": 39, "h": ""}, {"t": "recall", "q": "What is the difference between a second language and a foreign language?<br>إيه الفرق بين لغة تانية ولغة أجنبية؟", "a": "A second language is used daily where the person lives. A foreign language is studied but not used daily where the person lives.<br>اللغة التانية بتتستخدم كل يوم في المكان اللي الشخص عايش فيه. اللغة الأجنبية بتتدرس بس مش بتتستخدم كل يوم في مكانه.", "n": 1, "i": 40, "h": ""}, {"t": "recall", "q": "Give two examples of words that changed meaning, and two loanwords.<br>اذكر مثالين لكلمات اتغير معناها، ومثالين لكلمات مستعارة.", "a": "Changed meaning: sly (once wise), naughty (once having nothing), villain (once farm worker). Loanwords: sofa (Arabic), garage (French), kiosk (Turkish), tycoon (Japanese).<br>اتغير معناها: sly (كانت حكيم)، naughty (كانت معندوش حاجة)، villain (كانت عامل مزرعة). مستعارة: sofa (عربي)، garage (فرنسي)، kiosk (تركي)، tycoon (ياباني).", "n": 1, "i": 41, "h": ""}, {"t": "write", "q": "Explain why English is so important in the world today (3-4 sentences).<br>اشرح ليه الإنجليزي مهم أوي في العالم النهارده (٣-٤ جمل).", "key": "tefl2-01:1", "a": "English is the main language of science, business, technology, medicine and travel. Hundreds of millions speak it, and many more study it in school. Learners want it for jobs, study and the internet. This is why the demand for English teachers keeps growing.<br>الإنجليزي هو اللغة الأساسية للعلوم والتجارة والتكنولوجيا والطب والسفر. مئات الملايين بيتكلموه، وناس أكتر بتدرسه في المدرسة. المتعلمين عايزينه للشغل والدراسة والإنترنت. عشان كده الطلب على مدرسين الإنجليزي مستمر في الزيادة.", "n": 1, "i": 42, "h": ""}, {"t": "write", "q": "Describe where English comes from and how it grew (3-4 sentences).<br>اوصف الإنجليزي جه منين وإزاي كبر (٣-٤ جمل).", "key": "tefl2-01:2", "a": "English belongs to the Indo-European family and is a Germanic language, close to German and Dutch. Later it borrowed many words from French and Latin, which are Romance languages, and from many other languages such as Arabic, Turkish and Japanese. Meanings also change over time, as with sly and naughty.<br>الإنجليزي من العيلة الهندو أوروبية وهو لغة جرمانية، قريب من الألماني والهولندي. بعدين استعار كلمات كتير من الفرنسي واللاتيني، وهما لغات رومانسية، ومن لغات تانية زي العربي والتركي والياباني. والمعاني كمان بتتغيّر مع الوقت، زي sly وnaughty.", "n": 1, "i": 43, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: how languages have been taught, from Grammar Translation to the Direct Method.</div><div class=\"u\">الدرس الجاي: إزاي اتعلّمت اللغات على مر الزمن، من الترجمة والقواعد لحد الطريقة المباشرة.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 44}];</script>
