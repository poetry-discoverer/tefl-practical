<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حفظ تقدمي | Learn TEFL</title>
<link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/player.css">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#58cc02"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Learn TEFL"><link rel="apple-touch-icon" href="assets/icons/logo-180.png"><link rel="icon" href="assets/icons/logo-32.png" type="image/png" sizes="32x32"><link rel="shortcut icon" href="favicon.ico"></head>
<body>
<canvas id="confetti"></canvas>
<header class="topbar"><div class="wrap">
  <a class="logo" href="index.html"><span class="owl img"><img src="assets/icons/logo-128.png" alt="" width="50" height="50"></span> Learn TEFL</a>
  <div class="stats">
    <span class="pill xp"><span class="em">⭐</span> <span class="xp-val">0</span></span>
    <span class="pill streak"><span class="em">🔥</span> استمر!</span>
  </div>
</div></header>
<main class="wrap"><div class="lesson-head"><div class="emoji"><span class="em">💾</span></div><h1>حفظ تقدمي</h1><p style="color:var(--ink-soft)">من غير حساب ولا سيرفر. خد كود تقدمك وحطه على جهاز تاني، أو ارجع بيه لو مسحت بيانات المتصفح.</p></div>
<div class="plan-card" id="badges" style="margin-bottom:14px"><h2 style="margin-top:0">🏅 أوسمتي</h2><div class="badges" id="badges-list"></div></div>
<div class="plan-card" style="margin-bottom:14px"><h2 style="margin-top:0">١) خد الكود</h2><textarea id="code" readonly style="width:100%;min-height:110px;font-size:14px;direction:ltr;border:2px solid #e5e5e5;border-radius:14px;padding:10px"></textarea><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><button class="pl-next" id="copy" style="flex:1;min-width:140px">انسخ الكود</button><button class="pl-next" id="dl" style="flex:1;min-width:140px;background:#1cb0f6;box-shadow:0 6px 0 #1899d6">حمّل كملف</button></div><p id="info" style="color:#777"></p></div>
<div class="plan-card"><h2 style="margin-top:0">٢) استرجع تقدمك</h2><p style="color:#777;margin-top:0">الصق الكود هنا. الاسترجاع بيدمج تقدمك الحالي مع المحفوظ وبياخد الأعلى، ومفيش حاجة بتتمسح.</p><textarea id="in" style="width:100%;min-height:110px;font-size:14px;direction:ltr;border:2px solid #e5e5e5;border-radius:14px;padding:10px" placeholder="PJ1...."></textarea><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><button class="pl-next" id="imp" style="flex:1;min-width:140px">استرجع</button><label class="pl-next" style="flex:1;min-width:140px;text-align:center;cursor:pointer;background:#1cb0f6;box-shadow:0 6px 0 #1899d6">من ملف<input type="file" id="f" accept=".txt" hidden></label></div><p id="msg" style="font-weight:800"></p></div></main>
<footer class="footer">دروس جديدة بتتضاف باستمرار <span class="em">💚</span></footer>
<script src="assets/app.js"></script>
<script>
async function z(str,mode){const bs=mode==="c"?new CompressionStream("gzip"):new DecompressionStream("gzip");const w=bs.writable.getWriter();w.write(str);w.close();return new Uint8Array(await new Response(bs.readable).arrayBuffer())}
function b64(u){let s="";u.forEach(c=>s+=String.fromCharCode(c));return btoa(s)}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function make(){const j=JSON.stringify(state());const utf=new TextEncoder().encode(j);if(window.CompressionStream){return "PJ1."+b64(await z(utf,"c"))}return "PJ0."+b64(utf)}
async function parse(c){c=c.trim().replace(/\s+/g,"");let j;if(c.startsWith("PJ1.")){j=new TextDecoder().decode(await z(unb64(c.slice(4)),"d"))}else if(c.startsWith("PJ0.")){j=new TextDecoder().decode(unb64(c.slice(4)))}else throw 0;const o=JSON.parse(j);if(typeof o!=="object"||!o||typeof o.xp!=="number")throw 0;return o}
function merge(a,b){const r=Object.assign({},a);r.xp=Math.max(a.xp||0,b.xp||0);r.done=Object.assign({},b.done,a.done);r.sx=Object.assign({},b.sx,a.sx);r.steps=Object.assign({},b.steps||{});Object.keys(a.steps||{}).forEach(k=>{r.steps[k]=Math.max(r.steps[k]||0,a.steps[k])});r.answers=Object.assign({},b.answers,a.answers);r.sr=Object.assign({},b.sr,a.sr);r.exams=Object.assign({},b.exams);Object.keys(a.exams||{}).forEach(k=>{const x=a.exams[k],y=r.exams[k];r.exams[k]=!y||(x.n||0)>=(y.n||0)?Object.assign({},x,{best:Math.max(x.best||0,(y||{}).best||0)}):y});r.srm=Math.max(a.srm||0,b.srm||0);if(!a.last||(b.last&&b.last.t>a.last.t))r.last=b.last||a.last;r.off=a.off;return r}
(async function(){const c=await make();document.getElementById("code").value=c;const s=state();document.getElementById("info").textContent="نقاطك: "+s.xp+" · دروس خلصت: "+Object.keys(s.done||{}).length;
document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(c)}catch(e){const t=document.getElementById("code");t.select();document.execCommand("copy")}document.getElementById("copy").textContent="اتنسخ ✅"};
document.getElementById("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/plain"}));a.download="progress-code.txt";a.click()};
async function imp(t){const m=document.getElementById("msg");try{const o=await parse(t);save(merge(state(),o));m.style.color="#2b7a00";m.textContent="تم الاسترجاع ✅ نقاطك دلوقتي "+state().xp;if(window.refreshHeader)refreshHeader()}catch(e){m.style.color="#b30000";m.textContent="الكود مش صحيح. تأكد إنك نسخته كامل."}}
document.getElementById("imp").onclick=()=>imp(document.getElementById("in").value);
document.getElementById("f").onchange=e=>{const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(e.target.files[0])}})();
</script>
<script>if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js")})</script></body></html>
